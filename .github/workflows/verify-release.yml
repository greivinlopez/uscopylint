name: Verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to verify (leave blank for latest)
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/verify-release.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache: false

      - name: Install the released CLI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [[ -z "$tag" ]]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          go install "github.com/greivinlopez/uscopylint@$tag"
          version=$(uscopylint --version)
          echo "$version"
          test "$version" = "uscopylint $tag"

      - name: Verify exit code and JSON edit for a known finding
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          git init -q fixture
          cd fixture
          printf '%s\n' '<label>Shopping <b>cart</b></label>' > Cart.tsx
          git add Cart.tsx
          git -c user.name=CI -c user.email=ci@example.invalid commit -qm 'Clean baseline'
          printf '%s\n' '<label>Shopping <b>trolley</b></label>' > Cart.tsx

          report="$RUNNER_TEMP/uscopylint.json"
          status=0
          uscopylint --changed HEAD --output JSON > "$report" || status=$?
          if [[ "$status" != 1 ]]; then
            echo "::error::Expected exit 1 for the fixture, got $status"
            exit 1
          fi
          jq -es 'length == 1 and (.[0] | type == "array" and length == 1 and
            (.[0] | .path == "Cart.tsx" and .line == 1 and .column == 20 and
             .endColumn == 27 and .word == "trolley" and .suggestion == "cart" and
             .sourceLine == "<label>Shopping <b>trolley</b></label>"))' "$report"

      - name: Upload verified JSON findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: uscopylint-release-findings
          path: ${{ runner.temp }}/uscopylint.json
          if-no-files-found: error
